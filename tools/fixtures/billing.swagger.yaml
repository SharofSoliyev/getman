swagger: "2.0"
info:
  title: Billing
  version: "2.1"
  description: A Swagger 2.0 description in YAML, used by the GetMan test suite.
host: api.billing.test
basePath: /v2
schemes:
  - https
securityDefinitions:
  apiKey:
    type: apiKey
    name: X-Billing-Key
    in: header
security:
  - apiKey: []
paths:
  /invoices:
    get:
      tags:
        - invoices
      summary: List invoices
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          required: true
        - name: customer
          in: query
          type: string
      responses:
        200:
          description: ok
    post:
      tags:
        - invoices
      summary: Raise an invoice
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Invoice"
      responses:
        201:
          description: created
  /invoices/{id}/pay:
    post:
      tags:
        - invoices
      summary: Pay an invoice
      parameters:
        - name: id
          in: path
          required: true
          type: string
        - name: method
          in: formData
          required: true
          type: string
          enum:
            - card
            - transfer
      responses:
        200:
          description: ok
definitions:
  Invoice:
    type: object
    required:
      - amount
    properties:
      amount:
        type: number
        example: 149.5
      currency:
        type: string
        default: UZS
      paid:
        type: boolean
      lines:
        type: array
        items:
          type: object
          properties:
            sku:
              type: string
            qty:
              type: integer
