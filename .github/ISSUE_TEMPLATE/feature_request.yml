name: Feature request
description: Something GetMan should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation, not just the feature. What is awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like GetMan to do
    validations:
      required: true

  - type: input
    id: postman
    attributes:
      label: How Postman does it
      description: >
        If Postman has this, say where it lives in its interface — matching it exactly is a goal of
        the project.
