name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so a release runs exactly the checks a commit runs.
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build GetMan.sln -c Release --nologo

      # No network in CI, so the live HTTP section is skipped. Everything else runs.
      - name: Service tests
        run: dotnet run --project tools/SelfTest -c Release --no-build -- --offline

      # Builds every window, compares the language tables against English, and drives the
      # interaction flows. XAML errors only surface at run time, so this is what catches them.
      #
      # Start-Process, not a bare call: GetMan.exe is a GUI subsystem binary, so PowerShell does
      # not wait for it and never sets $LASTEXITCODE. Run plainly, this step passed in
      # milliseconds whatever the app did.
      - name: Window and interaction self-check
        run: |
          $app = 'src/GetMan/bin/Release/net9.0-windows/GetMan.exe'
          $run = Start-Process -FilePath $app -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "self-check failed (exit $($run.ExitCode))" }
          exit 0

      # The fixture points at a closed local port, so this exercises import, run, report and the
      # exit code without needing anything to answer.
      - name: CLI smoke test
        run: |
          $cli = "src/GetMan.Cli/bin/Release/net9.0/getman.exe"

          & $cli --version
          $version = $LASTEXITCODE
          if ($version -ne 0) { throw "getman --version exited $version" }

          & $cli run tools/fixtures/offline-smoke.postman_collection.json -r junit -o cli-report.xml --no-color
          $run = $LASTEXITCODE
          if ($run -ne 1) { throw "expected exit 1 for the refused connection, got $run" }
          if (-not (Test-Path cli-report.xml)) { throw "no JUnit report was written" }
          if ((Get-Content cli-report.xml -Raw) -notmatch 'failures="1"') { throw "the JUnit report did not record the failure" }

          Write-Host "CLI smoke test ok"

          # The runner ends the step with whatever $LASTEXITCODE holds, and here that is the 1 the
          # test is asserting on. Saying so explicitly is what keeps a passing check from failing.
          exit 0

      # IncludeNativeLibrariesForSelfExtract is what makes "single file" true for WPF; without it
      # the publish leaves five native libraries beside the exe and the exe alone is broken.
      - name: Publish single file
        run: >
          dotnet publish src/GetMan -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist --nologo

      - name: Publish the CLI
        run: >
          dotnet publish src/GetMan.Cli -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist-cli --nologo

      # The uploaded artifact is one file per app, so anything still sitting beside them would
      # be silently dropped and the download would be broken.
      - name: The published executables have to stand alone
        run: |
          foreach ($dir in 'dist', 'dist-cli') {
            $stray = @(Get-ChildItem $dir -File | Where-Object { $_.Extension -notin '.exe', '.pdb' })
            if ($stray.Count) { throw "$dir has files the artifact would leave behind: $($stray.Name -join ', ')" }
          }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: GetMan-win-x64
          path: |
            dist/GetMan.exe
            dist-cli/getman.exe
          if-no-files-found: error

  # The desktop app is WPF and stops at Windows, but the CLI shares only Models and Services,
  # which have no WPF in them. That is a claim worth running rather than asserting, so the whole
  # service suite and the CLI itself are exercised on Linux, where most CI actually happens.
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the cross-platform projects
        run: |
          dotnet build src/GetMan.Cli -c Release --nologo
          dotnet build tools/SelfTest -c Release --nologo

      - name: Service tests
        run: dotnet run --project tools/SelfTest -c Release --no-build -- --offline

      - name: CLI smoke test
        run: |
          set -e
          cli=src/GetMan.Cli/bin/Release/net9.0/getman
          "$cli" --version

          # A refused connection is the expected outcome, so a zero here means the run did not
          # happen. `set -e` would kill the script on the 1, hence the explicit capture.
          code=0
          "$cli" run tools/fixtures/offline-smoke.postman_collection.json \
                 -r junit -o cli-report.xml --no-color || code=$?
          [ "$code" = "1" ] || { echo "expected exit 1, got $code"; exit 1; }
          grep -q 'failures="1"' cli-report.xml || { echo "the JUnit report did not record the failure"; exit 1; }

          # The importer has to work here too, not just on Windows.
          "$cli" run tools/fixtures/billing.swagger.yaml --no-color | grep -q 'List invoices' \
            || { echo "the YAML Swagger import produced no requests"; exit 1; }
          echo "CLI smoke test ok"

      - name: Publish for Linux and check it runs standalone
        run: |
          set -e
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/GetMan.Cli -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -o "out/$rid" --nologo
            stray=$(find "out/$rid" -maxdepth 1 -type f ! -name getman ! -name '*.pdb' | wc -l)
            [ "$stray" = "0" ] || { echo "out/$rid has files a download would leave behind"; \
                                    ls -la "out/$rid"; exit 1; }
          done

          # linux-x64 is this runner's own architecture, so it can be run from an empty directory
          # the way a download would be. arm64 is built but cannot be executed here.
          mkdir -p sandbox && cp out/linux-x64/getman sandbox/getman && chmod +x sandbox/getman
          cd sandbox && ./getman --version

      - uses: actions/upload-artifact@v4
        with:
          name: getman-linux
          path: |
            out/linux-x64/getman
            out/linux-arm64/getman
          if-no-files-found: error
